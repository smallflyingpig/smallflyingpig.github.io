<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Jiguo Li</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/blog.css">
  <link rel="shortcut icon" href="../jiguo.ico">
</head>
<body class="blog-index-page">

<nav class="top-nav">
  <div class="primary-nav" aria-label="主导航">
    <a href="../index_ch.html">主页</a>
    <a href="index.html" class="active">博客</a>
  </div>
  <div class="language-switch" aria-label="语言切换">
    <span class="language-option active" aria-current="true">中文</span>
    <span class="language-option unavailable" aria-disabled="true" aria-label="EN（英文博客暂未提供）" title="英文博客暂未提供">EN</span>
  </div>
</nav>

<div class="page-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="../img/jiguo.png" alt="Jiguo Li" class="sidebar-photo">
      <h1 class="sidebar-name">Jiguo Li</h1>
      <p class="sidebar-title">Senior Engineer @ Meituan</p>
      <div class="profile-links">
        <a href="https://github.com/smallflyingpig" class="profile-link">Github</a>
        <a href="https://scholar.google.com/citations?user=NfQeyQ4AAAAJ" class="profile-link">Scholar</a>
      </div>
    </div>
    <div class="section-nav-title" id="categoryLabel">分类</div>
    <ul class="section-nav" id="catFilter" aria-labelledby="categoryLabel">
      <li><button type="button" class="active" data-cat="all" aria-pressed="true" disabled>全部分类</button></li>
      <li><button type="button" data-cat="tech" aria-pressed="false" disabled>技术</button></li>
      <li><button type="button" data-cat="essay" aria-pressed="false" disabled>随笔</button></li>
      <li><button type="button" data-cat="other" aria-pressed="false" disabled>其他</button></li>
    </ul>
    <div class="section-nav-title" id="tagLabel">标签</div>
    <div class="tag-cloud" id="tagFilter" role="group" aria-labelledby="tagLabel"></div>
    <div class="section-nav-title" id="archiveLabel">归档</div>
    <ul class="section-nav" id="yearFilter" aria-labelledby="archiveLabel"></ul>
  </aside>

  <button class="sidebar-toggle" id="sidebarToggle" type="button"
          aria-controls="sidebar" aria-expanded="false" aria-label="打开页面导航">☰</button>
  <button class="sidebar-backdrop" id="sidebarBackdrop" type="button"
          aria-label="关闭页面导航" tabindex="-1"></button>

  <div class="main-content-wrapper">
    <main class="main-content">
      <div class="mobile-identity">
        <img src="../img/jiguo.png" alt="" width="56" height="56">
        <div>
          <p class="mobile-identity-name">Jiguo Li</p>
          <p class="mobile-identity-title">Senior Engineer @ Meituan</p>
        </div>
      </div>
      <h1 class="section-title" id="pageTitle">博客</h1>
      <p class="blog-intro">大语言模型、AI 论文与工程实践笔记。</p>
      <div class="blog-toolbar">
        <p id="postStatus" class="post-status" role="status" aria-live="polite" aria-atomic="true">正在加载文章…</p>
        <button class="clear-filters" id="clearFilters" type="button" disabled>清除筛选</button>
      </div>
      <div class="blog-grid" id="blogGrid" aria-busy="true"></div>
      <p class="no-results" id="noResults" hidden>没有符合当前筛选条件的文章。请清除筛选后重试。</p>
      <button class="retry-load" id="retryLoad" type="button" hidden>重新加载</button>
      <noscript><p class="no-results">请启用 JavaScript 以加载文章列表和筛选功能。</p></noscript>
    </main>
  </div>
</div>

<script src="../js/blog.js"></script>
<script src="../js/sidebar.js"></script>

</body>
</html>
